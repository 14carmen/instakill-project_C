<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaKill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF0F5;
    --surface: #FFFFFF;
    --ink: #2B1530;
    --muted: #7A5C72;
    --line: #F0D6E2;
    --for-you: #E0337E;
    --learned: #7A1F5C;
    --chrono: #B98AA5;
    --heart: #E0337E;
    --danger-bg: #FDECEF;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --accent: var(--for-you);
  }
  body[data-strategy="learned"] { --accent: var(--learned); }
  body[data-strategy="chronological"] { --accent: var(--chrono); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(251, 240, 245, .88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 1080px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 20px;
  }
  .wordmark {
    font: 800 1.65rem/1 var(--display); letter-spacing: -.03em; margin: 0; white-space: nowrap;
  }
  .wordmark span { color: var(--accent); transition: color .3s; }
  form.search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
  form.search input {
    width: 100%; padding: 9px 16px 9px 38px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
  }
  form.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  /* ---------- layout ---------- */
  main.layout {
    max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px;
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; align-items: start;
  }
  aside.rail { position: sticky; top: 84px; display: grid; gap: 22px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .panel h2 { font: 700 1.05rem/1.2 var(--display); margin: 0 0 12px; }
  label.field { display: grid; gap: 6px; font-size: .92rem; color: var(--muted); }
  .field input, .field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #FFFAFC; color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 84px; }
  .me { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .avatar {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font: 700 1.05rem/1 var(--display); color: #fff;
  }
  .me strong { display: block; font-family: var(--display); font-size: 1.1rem; line-height: 1.2; }
  .me small { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 999px;
    padding: 7px 16px; font-weight: 700; cursor: pointer;
  }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #join-name { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #FFFAFC; }
  .hint { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }

  /* ---------- the strategy switch: the one bold element ---------- */
  .feed-head { display: grid; gap: 14px; margin-bottom: 18px; }
  .feed-head h2 { font: 800 clamp(1.8rem, 3.4vw, 2.5rem)/1.05 var(--display); letter-spacing: -.025em; margin: 0; }
  .switch {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 5px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; position: relative;
  }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch label {
    position: relative; z-index: 1; text-align: center; padding: 10px 8px; border-radius: 999px;
    font: 700 1rem/1 var(--display); cursor: pointer; color: var(--muted); transition: color .25s;
  }
  .switch input:checked + label { color: #fff; }
  .switch input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
  .switch .thumb {
    position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 18px) / 3);
    border-radius: 999px; background: var(--accent);
    transition: transform .35s cubic-bezier(.2, .7, .2, 1), background-color .35s;
  }
  body[data-strategy="learned"] .switch .thumb { transform: translateX(calc(100% + 4px)); }
  body[data-strategy="chronological"] .switch .thumb { transform: translateX(calc(200% + 8px)); }
  .explain { margin: 0; color: var(--muted); max-width: 62ch; }
  .travel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .95rem; }
  .travel input[type="datetime-local"] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .travel .toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .travel .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- posts ---------- */
  ol.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .post {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 16px 12px;
  }
  .rank { text-align: center; padding-top: 2px; }
  .rank b { display: block; font: 800 1.6rem/1 var(--display); letter-spacing: -.03em; }
  .rank small { display: block; margin-top: 4px; font-size: .74rem; color: var(--muted); line-height: 1.2; }
  .rank small.up { color: #1F7A4D; }
  .rank small.down { color: #A3364E; }
  .post h3 { font: 700 1.2rem/1.25 var(--display); margin: 0 0 4px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .meta button.link {
    border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-weight: 700; text-decoration: underline;
    text-decoration-color: var(--line); text-underline-offset: 3px;
  }
  .meta button.link[aria-pressed="true"] { color: var(--for-you); text-decoration: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: .78rem; padding: 2px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .score { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 220px) auto; gap: 10px; align-items: center; font-size: .86rem; color: var(--muted); }
  .bar { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .like {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; cursor: pointer; color: var(--muted);
  }
  .like:hover { color: var(--heart); border-color: var(--heart); }
  .like[aria-pressed="true"] { color: #fff; background: var(--heart); border-color: var(--heart); }
  .like svg { width: 21px; height: 21px; }
  .like:disabled { opacity: .35; cursor: not-allowed; }
  .like:disabled:hover { color: var(--muted); border-color: var(--line); }

  .state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .state strong { display: block; font: 700 1.3rem/1.3 var(--display); color: var(--ink); margin-bottom: 6px; }
  .banner { background: var(--danger-bg); border: 1px solid #F3B8C6; color: #7A1631; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .more { display: flex; justify-content: center; margin-top: 18px; }
  .results-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .results-head h2 { font: 800 1.8rem/1.1 var(--display); margin: 0; letter-spacing: -.02em; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
    background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 12px 10px 20px;
    display: flex; gap: 14px; align-items: center; z-index: 20;
    transition: transform .3s cubic-bezier(.2, .7, .2, 1), visibility 0s linear .3s;
    max-width: calc(100% - 32px);
  }
  .toast.show { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }
  .toast button { background: rgba(255, 255, 255, .14); border: 0; color: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700; cursor: pointer; }
  .toast button[hidden] { display: none; }

  @media (max-width: 860px) {
    main.layout { grid-template-columns: 1fr; gap: 20px; }
    aside.rail { display: contents; }
    #panel-who { order: 0; }
    #content { order: 1; }
    #panel-compose, #panel-join { order: 2; }
    .top-inner { flex-wrap: wrap; }
    form.search { max-width: none; order: 3; flex-basis: 100%; }
  }
  @media (max-width: 480px) {
    .post { grid-template-columns: 40px minmax(0, 1fr); }
    .post .like { grid-column: 2; justify-self: start; }
    .switch label { font-size: .9rem; padding: 10px 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body data-strategy="for_you">

<header class="top">
  <div class="top-inner">
    <h1 class="wordmark">Insta<span>Kill</span></h1>
    <form class="search" id="search-form" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr-only" for="q">Search posts by meaning</label>
      <input id="q" type="search" placeholder="Search by meaning, e.g. space adventure" autocomplete="off">
    </form>
  </div>
</header>

<main class="layout">
  <aside class="rail">
    <section class="panel" id="panel-who" aria-labelledby="who">
      <h2 id="who">You are</h2>
      <label class="field">Switch user
        <input id="user-input" list="user-list" placeholder="Type a name or id" autocomplete="off">
      </label>
      <datalist id="user-list"></datalist>
      <div class="me" id="me" hidden>
        <div class="avatar" id="me-avatar"></div>
        <div><strong id="me-name"></strong><small id="me-stats"></small></div>
      </div>
    </section>

    <section class="panel" id="panel-compose" aria-labelledby="compose-title">
      <h2 id="compose-title">New post</h2>
      <form id="compose" class="field">
        <label class="sr-only" for="compose-text">What do you want to share?</label>
        <textarea id="compose-text" placeholder="What do you want to share?" maxlength="500"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn" type="submit">Publish</button></div>
        <p class="hint">Your own posts show up in other people's feeds, not in yours.</p>
      </form>
    </section>

    <section class="panel" id="panel-join" aria-labelledby="join-title">
      <h2 id="join-title">New account</h2>
      <form id="join" class="row">
        <label class="sr-only" for="join-name">Username</label>
        <input id="join-name" placeholder="username" required maxlength="40">
        <button class="btn quiet" type="submit">Create</button>
      </form>
    </section>
  </aside>

  <section id="content" aria-live="polite">
    <div id="error"></div>

    <div id="feed-view">
      <div class="feed-head">
        <h2 id="feed-title">Your feed</h2>
        <div class="switch" role="radiogroup" aria-label="How to order the feed">
          <span class="thumb" aria-hidden="true"></span>
          <input type="radio" name="strategy" id="s-for_you" value="for_you" checked><label for="s-for_you">For you</label>
          <input type="radio" name="strategy" id="s-learned" value="learned"><label for="s-learned">Learned</label>
          <input type="radio" name="strategy" id="s-chronological" value="chronological"><label for="s-chronological">Newest</label>
        </div>
        <p class="explain" id="explain"></p>
        <div class="travel">
          <label class="toggle"><input type="checkbox" id="travel-on"> Show the feed as it was on</label>
          <label class="sr-only" for="travel-at">Date and time</label>
          <input type="datetime-local" id="travel-at" value="2016-02-04T21:34">
        </div>
        <p class="hint" id="travel-hint" hidden>Likes are paused while you look at a past feed: a like given today would not exist on that date.</p>
      </div>
      <ol class="feed" id="feed"></ol>
      <div class="more"><button class="btn quiet" id="more" hidden>Show more</button></div>
    </div>

    <div id="search-view" hidden>
      <div class="results-head">
        <h2 id="results-title"></h2>
        <button class="btn quiet" id="back">Back to your feed</button>
      </div>
      <ol class="feed" id="results"></ol>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
(() => {
  const EXPLAIN = {
    for_you: "Fresh posts, people you follow and posts with many likes, mixed by a fixed formula.",
    learned: "A small neural network predicts how likely you are to like each post, from your past likes.",
    chronological: "The newest posts first. No guessing.",
  };
  const NAMES = { for_you: "For you", learned: "Learned", chronological: "Newest" };
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MAX_LIMIT = 350, PAGE = 30;          // GET /feed returns at most 350 posts
  const $ = (id) => document.getElementById(id);

  const state = {
    users: new Map(), posts: new Map(), userId: null, strategy: "for_you",
    limit: 20, following: new Set(), lastRanks: new Map(), lastStrategy: null, liked: new Set(),
  };

  // ---------- API ----------
  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
    } catch {
      throw new Error("The InstaKill server is not answering. Start it with: uvicorn app.main:app --reload");
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const body = await res.json(); detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); } catch {}
      throw new Error(`${res.status}: ${detail}`);
    }
    return res.json();
  }
  const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });
  const del = (path, body) => api(path, { method: "DELETE", body: JSON.stringify(body) });

  function showError(message) {
    $("error").innerHTML = message ? `<div class="banner" role="alert"></div>` : "";
    if (message) $("error").firstChild.textContent = message;
  }

  // ---------- helpers ----------
  function toDate(value) {
    if (value === null || value === undefined) return null;
    const text = String(value);
    if (/^\d+(\.\d+)?$/.test(text)) return new Date(parseFloat(text) * 1000);
    return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(text) ? text : text.replace(" ", "T") + "Z");
  }
  function when(value) {
    const d = toDate(value);
    if (!d || isNaN(d)) return "";
    const days = (Date.now() - d) / 864e5;
    if (days < 1 / 24) return "just now";
    if (days < 1) return `${Math.round(days * 24)} h ago`;
    if (days < 30) return `${Math.round(days)} days ago`;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }
  function hue(id) { return (id * 47) % 360; }
  function avatar(el, user) {
    const name = user ? user.username : "?";
    const number = name.match(/^ML_User_(\d+)$/);
    el.textContent = number ? number[1] : name.slice(0, 2).toUpperCase();
    el.style.fontSize = el.textContent.length > 2 ? ".85rem" : "";
    el.style.background = `hsl(${(hue(user ? user.id : 0) % 60) + 300} 50% 42%)`;
  }
  function username(id) {
    const u = state.users.get(id);
    if (!u) return `user ${id}`;
    return u.username === "movielens_catalogue" ? "MovieLens catalogue" : u.username;
  }
  function asOf() {
    if (!$("travel-on").checked || !$("travel-at").value) return null;
    return Math.floor(new Date($("travel-at").value + ":00Z").getTime() / 1000);
  }
  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';

  let toastTimer = null;
  function toast(text, undo) {
    $("toast-text").textContent = text;
    const button = $("toast-undo");
    button.hidden = !undo;
    button.onclick = undo ? () => { hideToast(); undo(); } : null;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, undo ? 6000 : 3000);
  }
  function hideToast() { $("toast").classList.remove("show"); }

  // ---------- cards ----------
  function card(item, index, { showScore, previous }) {
    const li = document.createElement("li");
    li.className = "post";
    li.dataset.id = item.post_id;
    const p = state.posts.get(item.post_id) || {};
    const author = item.user_id;
    const following = state.following.has(author);
    const genres = (p.genres || "").split("|").filter(Boolean);

    let movement = "";
    if (previous && state.lastStrategy && state.lastStrategy !== state.strategy) {
      const before = state.lastRanks.get(item.post_id);
      if (before === undefined) movement = `<small>new in ${NAMES[state.strategy]}</small>`;
      else if (before !== index + 1) movement = `<small class="${before > index + 1 ? "up" : "down"}">was #${before}</small>`;
    }

    let score = "";
    if (showScore && typeof item.score === "number") {
      if (state.strategy === "learned") {
        const pct = Math.round(item.score * 100);
        score = `<div class="score"><span class="bar"><i style="width:${pct}%"></i></span><span>${pct}% likely you'll like it</span></div>`;
      } else if (state.strategy === "for_you") {
        score = `<div class="score"><span>Score ${item.score.toFixed(2)}</span></div>`;
      } else {
        score = `<div class="score"><span>${Math.round(item.score * 100)}% similar to your search</span></div>`;
      }
    }

    li.innerHTML = `
      <div class="rank"><b>#${index + 1}</b>${movement}</div>
      <div>
        <h3></h3>
        <div class="meta">
          <span>by <button class="link follow" aria-pressed="${following}"></button></span>
          <span>${when(item.created_at ?? p.created_at)}</span>
        </div>
        ${genres.length ? `<div class="chips">${genres.map((g) => `<span class="chip"></span>`).join("")}</div>` : ""}
        ${score}
      </div>
      <button class="like" aria-pressed="false">${HEART}</button>`;
    li.querySelector("h3").textContent = item.content;
    li.querySelectorAll(".chip").forEach((chip, i) => { chip.textContent = genres[i]; });

    const followBtn = li.querySelector(".follow");
    followBtn.textContent = username(author);
    followBtn.title = following ? `Unfollow ${username(author)}` : `Follow ${username(author)}`;
    followBtn.disabled = author === state.userId;
    followBtn.addEventListener("click", () => toggleFollow(author));

    const likeBtn = li.querySelector(".like");
    likeBtn.setAttribute("aria-label", `Like “${item.content}”`);
    if (asOf() !== null) { likeBtn.disabled = true; likeBtn.title = "Likes are paused while you look at a past feed"; }
    likeBtn.addEventListener("click", () => like(item, li, likeBtn));
    return li;
  }

  // Animate cards from their old place to their new one (FLIP).
  function renderList(list, items, opts) {
    const before = new Map();
    list.querySelectorAll(".post").forEach((el) => before.set(el.dataset.id, el.getBoundingClientRect().top));
    const nodes = items.map((item, i) => card(item, i, opts));
    list.replaceChildren(...nodes);
    if (REDUCED) return;
    nodes.forEach((el, i) => {
      const old = before.get(el.dataset.id);
      const now = el.getBoundingClientRect().top;
      if (old === undefined) {
        el.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
                   { duration: 280, delay: Math.min(i, 8) * 25, easing: "ease-out", fill: "backwards" });
      } else if (Math.abs(old - now) > 1) {
        el.animate([{ transform: `translateY(${old - now}px)` }, { transform: "none" }],
                   { duration: 520, easing: "cubic-bezier(.2,.7,.2,1)" });
      }
    });
  }

  // ---------- feed ----------
  let feedRequest = 0;
  async function loadFeed() {
    if (state.userId === null) return;
    const ticket = ++feedRequest;
    const params = new URLSearchParams({ user_id: state.userId, strategy: state.strategy, limit: state.limit });
    const t = asOf();
    if (t !== null) params.set("as_of", t);
    $("feed").setAttribute("aria-busy", "true");
    try {
      const data = await api(`/feed?${params}`);
      if (ticket !== feedRequest) return;
      showError("");
      const items = data.results;
      if (!items.length) {
        $("feed").innerHTML = `<li class="state"><strong>Nothing to show yet</strong>Follow someone, or switch to another user or date.</li>`;
      } else {
        renderList($("feed"), items, { showScore: true, previous: true });
      }
      $("more").hidden = items.length < state.limit || state.limit >= MAX_LIMIT;
      state.lastRanks = new Map(items.map((it, i) => [it.post_id, i + 1]));
      state.lastStrategy = state.strategy;
    } catch (err) {
      if (ticket === feedRequest) showError(err.message);
    } finally {
      $("feed").removeAttribute("aria-busy");
    }
  }

  function setStrategy(strategy) {
    state.strategy = strategy;
    document.body.dataset.strategy = strategy;
    $("explain").textContent = EXPLAIN[strategy];
    loadFeed();
  }

  async function like(item, li, button) {
    if (state.userId === null) return;
    button.setAttribute("aria-pressed", "true");
    try {
      await post("/likes", { user_id: state.userId, post_id: item.post_id });
    } catch (err) {
      button.setAttribute("aria-pressed", "false");
      showError(err.message);
      return;
    }
    state.liked.add(item.post_id);
    updateStats();
    if (!REDUCED) {
      await li.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.97)" }],
                       { duration: 220, easing: "ease-in", fill: "forwards" }).finished;
    }
    li.remove();
    toast(`Liked “${item.content}”`, async () => {
      await del("/likes", { user_id: state.userId, post_id: item.post_id }).catch((e) => showError(e.message));
      state.liked.delete(item.post_id);
      updateStats();
      loadFeed();
    });
    state.lastStrategy = null;          // the next render is a refresh, not a strategy switch
    loadFeed();
  }

  async function toggleFollow(author) {
    if (state.userId === null || author === state.userId) return;
    const was = state.following.has(author);
    try {
      if (was) await del("/follows", { follower_id: state.userId, followed_id: author });
      else await post("/follows", { follower_id: state.userId, followed_id: author });
    } catch (err) { showError(err.message); return; }
    if (was) state.following.delete(author); else state.following.add(author);
    toast(was ? `Unfollowed ${username(author)}` : `Following ${username(author)}`);
    updateStats();
    state.lastStrategy = null;
    loadFeed();
  }

  // ---------- user ----------
  function updateStats() {
    const n = state.following.size;
    $("me-stats").textContent = `User #${state.userId}, following ${n} ${n === 1 ? "account" : "accounts"}`;
  }

  async function selectUser(id) {
    const user = state.users.get(id);
    if (!user) { showError(`There is no user with id ${id}.`); return; }
    state.userId = id;
    state.lastStrategy = null;
    state.limit = 20;
    try { localStorage.setItem("instakill-user", String(id)); } catch {}
    $("user-input").value = "";
    $("user-input").placeholder = user.username;
    $("me").hidden = false;
    $("me-name").textContent = user.username;
    avatar($("me-avatar"), user);
    $("feed-title").textContent = `${user.username}'s feed`;
    try {
      const data = await api(`/users/${id}/following`);
      state.following = new Set(data.following);
    } catch { state.following = new Set(); }
    updateStats();
    $("feed").replaceChildren();
    showSearch(false);
    loadFeed();
  }

  function fillUserList() {
    $("user-list").replaceChildren(...[...state.users.values()].map((u) => {
      const o = document.createElement("option");
      o.value = `${u.username} (#${u.id})`;
      return o;
    }));
  }

  function pickUserFromInput() {
    const text = $("user-input").value.trim();
    if (!text) return;
    const byId = text.match(/#?(\d+)\)?$/);
    let user = byId ? state.users.get(Number(byId[1])) : null;
    if (!user) user = [...state.users.values()].find((u) => u.username.toLowerCase() === text.toLowerCase());
    if (user) selectUser(user.id);
    else showError(`No user called “${text}”. Pick one from the list or create a new account.`);
  }

  // ---------- search ----------
  function showSearch(on) {
    $("search-view").hidden = !on;
    $("feed-view").hidden = on;
  }
  async function search(q) {
    showSearch(true);
    $("results-title").textContent = `Posts about “${q}”`;
    $("results").innerHTML = "";
    try {
      const data = await api(`/search?${new URLSearchParams({ q, limit: 20 })}`);
      showError("");
      if (!data.results.length) {
        $("results").innerHTML = `<li class="state"><strong>No posts found</strong>Try other words: the search matches meaning, not exact text.</li>`;
        return;
      }
      const saved = state.strategy;
      state.strategy = "search";
      renderList($("results"), data.results, { showScore: true, previous: false });
      state.strategy = saved;
    } catch (err) { showError(err.message); }
  }

  // ---------- wiring ----------
  document.querySelectorAll('input[name="strategy"]').forEach((r) => r.addEventListener("change", () => setStrategy(r.value)));
  $("travel-on").addEventListener("change", () => {
    $("travel-hint").hidden = !$("travel-on").checked;
    state.lastStrategy = null;
    loadFeed();
  });
  $("travel-at").addEventListener("change", () => { if ($("travel-on").checked) { state.lastStrategy = null; loadFeed(); } });
  $("more").addEventListener("click", () => { state.limit = Math.min(MAX_LIMIT, state.limit + PAGE); state.lastStrategy = null; loadFeed(); });
  $("user-input").addEventListener("change", pickUserFromInput);
  $("user-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); pickUserFromInput(); } });
  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) search(q); });
  $("back").addEventListener("click", () => { $("q").value = ""; showSearch(false); });

  $("compose").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("compose-text").value.trim();
    if (!text || state.userId === null) return;
    try {
      const data = await post("/posts", { user_id: state.userId, content: text });
      state.posts.set(data.data.id, data.data);
      $("compose-text").value = "";
      toast("Published");
    } catch (err) { showError(err.message); }
  });

  $("join").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("join-name").value.trim();
    if (!name) return;
    try {
      const data = await post("/users", { username: name });
      state.users.set(data.data.id, data.data);
      fillUserList();
      $("join-name").value = "";
      toast(`Account ${name} created`);
      selectUser(data.data.id);
    } catch (err) {
      showError(err.message.includes("500") ? `The username “${name}” is already taken.` : err.message);
    }
  });

  // ---------- start ----------
  (async function start() {
    $("explain").textContent = EXPLAIN.for_you;
    try {
      const [users, posts] = await Promise.all([api("/users"), api("/posts")]);
      users.forEach((u) => state.users.set(u.id, u));
      posts.forEach((p) => state.posts.set(p.id, p));
      fillUserList();
      let saved = null;
      try { saved = Number(localStorage.getItem("instakill-user")); } catch {}
      const first = users.find((u) => u.username !== "movielens_catalogue");
      const id = state.users.has(saved) ? saved : state.users.has(514) ? 514 : first && first.id;
      if (id === undefined || id === null) {
        $("feed").innerHTML = `<li class="state"><strong>No users yet</strong>Create an account on the left, or seed the database with scripts/seed_movielens.py.</li>`;
        return;
      }
      selectUser(id);
    } catch (err) { showError(err.message); }
  })();
})();
</script>
</body>
</html>
